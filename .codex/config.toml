[project]
name = "BreadLab"
framework = "Laravel 10"
frontend = "Blade + Bootstrap"
database = "PostgreSQL"
language = "PHP"
description = "Bakery e-commerce and outlet operation system with customer website, admin backend, cashier POS, staff outlet operation, inventory, finance, and manager monitoring."

[paths]
laravel_root = "."
obsidian_vault = "C:/ObsidianMind"
project_memory = "C:/ObsidianMind/Breadlab-Mind/PROJECT-MEMORY.md"
current_session = "C:/ObsidianMind/Breadlab-Mind/CURRENT-SESSION.md"
codex_context = "C:/ObsidianMind/Breadlab-Mind/CODEX-CONTEXT.md"

[behavior]
prefer_small_steps = true
avoid_large_refactor_without_confirmation = true
preserve_existing_ui = true
preserve_existing_routes_when_possible = true
write_migrations_incrementally = true
run_tests_after_changes = true
explain_files_changed = true
report_plan_before_editing = true

[priorities]
current_phase = "Stock Movement Integration"
last_completed = [
  "Role Access and Outlet Context",
  "Cashier POS Foundation",
  "Cash Flow Shift Report",
  "Finance Target Net Profit",
  "Inventory Outlet Foundation",
  "Staff Daily Operation Foundation",
  "Material Request",
  "Waste Record",
  "Production WIP Record",
  "Closing Stock Opname",
  "Daily Operation Closing Summary",
  "Stock Movement Service Foundation",
  "Stock Opname Adjustment",
  "Waste Stock Deduction",
  "Production Stock Increase",
  "Material Issue Deduction"
]
next_phases = [
  "Purchasing and Goods Receipt",
  "Recipe BOM",
  "POS Stock Deduction",
  "Advanced COGS",
  "Midtrans Payment Gateway"
]

[constraints]
do_not_replace_existing_design = true
do_not_remove_existing_modules_without_confirmation = true
do_not_mix_cashier_panel_with_admin_panel = true
do_not_show_finance_to_cashier_or_staff = true
do_not_run_migrate_fresh_without_confirmation = true
do_not_update_inventory_stock_directly_from_controller = true
do_not_touch_pos_checkout_payment_shipment_finance_unless_requested = true
manager_must_be_read_only = true
staff_must_be_limited_by_outlet_and_division = true

[inventory_rules]
stock_service = "App\\Services\\Inventory\\StockMovementService"
stock_table = "inventory_stocks"
movement_table = "stock_movements"
all_stock_changes_must_use_service = true
all_stock_changes_must_create_stock_movement = true
prevent_negative_stock_by_default = true
use_idempotency_reference_per_item = true

[stock_integration_status]
stock_movement_service = "done"
stock_opname_adjustment = "done"
waste_stock_deduction = "done"
production_stock_increase = "done"
material_issue_deduction = "done"
purchasing_goods_receipt = "pending"
recipe_bom = "pending"
pos_stock_deduction = "pending"

[obsidian]
enabled = true
vault_path = "C:/ObsidianMind"
required_files = [
  "Breadlab-Mind/PROJECT-MEMORY.md",
  "Breadlab-Mind/CURRENT-SESSION.md",
  "Breadlab-Mind/CODEX-CONTEXT.md",
  "Breadlab-Mind/06-Module-Status.md",
  "Breadlab-Mind/07-Inventory-Flow.md",
  "Breadlab-Mind/15-Next-Development-Roadmap.md",
  "Breadlab-Mind/20-Changelog.md"
]